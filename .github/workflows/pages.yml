# The static site on GitHub Pages (scripts/build_pages.mjs): the page, the
# models of the archive pages.json's `assets` names (a release asset,
# unpacked as public/mjcf_assets) and the policies of pages.json. Needs
# Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci --ignore-scripts
      - run: pip install mujoco pillow

      # The models, then the page's runtimes (public/vendor), the library and
      # policy indexes and the thumbnails, from the models' screenshots.
      - run: node scripts/fetch_assets.mjs
      - run: node scripts/vendor.mjs
      - run: python scripts/thumbnails.py

      - name: Every model compiles
        run: python scripts/check_assets.py

      - run: node scripts/build_pages.mjs --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
