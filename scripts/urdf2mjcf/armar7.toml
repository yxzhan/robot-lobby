# KIT's ARMAR-7 from IAI's iai_robots for scripts/urdf2mjcf.py (keys: see pr2.toml):
#
#   git clone -b ros-jazzy https://github.com/code-iai/iai_robots
#   python3 scripts/urdf2mjcf.py scripts/urdf2mjcf/armar7.toml iai_robots

name = "armar7"
out = "robots/aicor/armar7"
source = "https://github.com/code-iai/iai_robots/tree/ros-jazzy"
package = "iai_kit_armar7"
xacro = "urdf/Armar7.urdf"

title = "ARMAR-7"
readme = """
KIT's ARMAR-7: a humanoid upper body with two 8-joint arms and five-finger
hands, a neck and an ankle-knee-hip lift, on a mobile platform. The platform
drives as a planar base (x / y / yaw servos); every other joint has a
position servo and everything above the platform is gravity compensated.
The URDF's virtual joints (gaze targets, grouped hand joints without links)
are welded.
"""
license = """
From [iai_robots](https://github.com/code-iai/iai_robots) (`iai_kit_armar7`), LGPL.
"""

root_pos = [0, 0, 0.035]   # the platform reaches 0.03 below root
gravcomp = ["Dummy_Platform_link"]

[joints]
weld = ['^VirtualCentralGaze', '^(Left|Right)Hand(Fingers|Index|ThumbCircumduction|ThumbFlexion)$']

[base]
kind = "planar"
kp_xy = 100000
kp_yaw = 30000

[[servo]]
match = '^(Ankle|Knee|Hip)$'
kp = 20000
armature = 1
[[servo]]
match = '^Neck_'
kp = 50
armature = 0.01
[[servo]]
match = '^Arm[LR][1-6]_'
kp = 500
armature = 0.1
[[servo]]
match = '^Arm[LR][78]_'
kp = 100
armature = 0.02
[[servo]]
match = ' [LR] \d Joint$'
kp = 2
armature = 0.001

[tcp]
"Hand L TCP_link" = "left_tcp"
"Hand R TCP_link" = "right_tcp"

[home]
ArmL3_Sho2 = 0.3
ArmR3_Sho2 = 0.3
ArmL5_Elb1 = 1.2
ArmR5_Elb1 = 1.2
