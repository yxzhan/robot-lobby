# IAI's Daisy (two UR arms with Schunk WPG grippers on a table) for
# scripts/urdf2mjcf.py (keys: see pr2.toml):
#
#   git clone -b ros-jazzy https://github.com/code-iai/iai_robots
#   python3 scripts/urdf2mjcf.py scripts/urdf2mjcf/daisy.toml iai_robots [dir with wpg_300_120_description]

name = "daisy"
out = "robots/digital_twin/daisy"
source = "https://github.com/code-iai/iai_robots/tree/ros-jazzy"
package = "iai_daisy_description"
xacro = "robots/daisy.urdf.xacro"

title = "Daisy"
readme = """
IAI's Daisy: two UR arms with parallel grippers on a table, and a camera over
it. The table is fixed (no base joint); every arm joint has a position servo
and the arms are gravity compensated. Each gripper is its finger joint
(actuator `*_gripper`), the other finger follows it (the URDF's mimic).
"""
license = """
From [iai_robots](https://github.com/code-iai/iai_robots) (`iai_daisy_description`, license not
stated in its package.xml), with meshes from ur_description (Universal Robots).
"""

gravcomp = ["map"]

[base]
kind = "fixed"

[[servo]]
match = '_(shoulder_pan|shoulder_lift|elbow)_joint$'
kp = 1000
armature = 0.2
[[servo]]
match = '_wrist_[123]_joint$'
kp = 200
armature = 0.05
[[servo]]
match = '^(left|right)_gripper_finger_joint$'
name = '\1_gripper'
kp = 200
forcerange = 40
armature = 0.01

[[camera]]
name = "table_camera"
link = "camera_link"
fovy = 58

[tcp]
left_gripper_tool_frame = "left_tcp"
right_gripper_tool_frame = "right_tcp"

[home]
left_shoulder_lift_joint = -1.57
left_elbow_joint = 1.57
left_wrist_1_joint = -1.57
right_shoulder_lift_joint = -1.57
right_elbow_joint = -1.57
right_wrist_1_joint = -1.57
