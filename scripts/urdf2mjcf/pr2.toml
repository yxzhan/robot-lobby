# Willow Garage's PR2 for scripts/urdf2mjcf.py:
#
#   git clone https://github.com/PR2/pr2_common
#   python3 scripts/urdf2mjcf.py scripts/urdf2mjcf/pr2.toml pr2_common
#
# This file also documents the keys (all but name, out, source, package,
# xacro, title, readme and license are optional; top-level keys go before
# the first [table], or TOML puts them in it).

name = "pr2"                         # the model (and file) name
out = "robots/digital_twin/pr2"      # under mjcf_assets/
source = "https://github.com/PR2/pr2_common"
package = "pr2_description"          # the ROS package: $(find ...), package://...
package_dir = "pr2_description"      # where it is in the clone ("" for the root)
xacro = "robots/pr2.urdf.xacro"      # in the package
# xacro_args = { KINECT1 = "false" }

title = "PR2"
readme = """
Willow Garage's PR2: a holonomic base, a torso lift, a pan-tilt head with
stereo and high-definition cameras, a tilting laser, two 7-joint arms with
parallel grippers. The base drives as a planar base (x / y / yaw servos; its
casters are welded); every other joint has a position servo, and the bodies
from the torso up are gravity compensated (the real arms are spring
counterbalanced). Each gripper is its l_finger joint (actuator `*_gripper`),
the other finger and the tips follow it (the URDF's mimic joints).
"""
license = "From [pr2_common](https://github.com/PR2/pr2_common) (`pr2_description`) by Willow Garage, BSD."

# Bodies whose subtrees are gravity compensated.
gravcomp = ["torso_lift_link"]

# Contact excludes beyond the ones found, and found pairs that do collide on
# the real robot (kept):
# exclude = [["a_link", "b_link"]]
# collide = [["c_link", "d_link"]]

[links]
# Left out with everything below them (regexes): gazebo-only mechanism models.
drop = ['_gripper_motor_(slider|screw|accelerometer)_link$', '_gripper_l_finger_tip_frame$',
        '^torso_lift_motor_screw_link$']
# No collision geoms (the base hull covers the casters).
no_collision = ['_caster_']

[joints]
weld = ['_caster_']                  # made fixed (regexes)

[base]
kind = "planar"                      # x / y / yaw servos on the root; else a free joint
kp_xy = 100000
kp_yaw = 20000
damping = [100, 50]                  # x / y, yaw


# Position servos, the first rule matching a joint applies: kp, dampratio (1),
# armature, forcerange, name (a regex replacement; default: the joint name
# without _joint). Joints matching none stay passive; mimic followers have none.
[[servo]]
match = '^torso_lift_joint$'
kp = 100000
[[servo]]
match = '^head_(pan|tilt)_joint$'
kp = 100
armature = 0.01
[[servo]]
match = '^laser_tilt_mount_joint$'
kp = 10
armature = 0.001
[[servo]]
match = '_(shoulder|upper_arm|elbow)'
kp = 800
armature = 0.1
[[servo]]
match = '_(forearm_roll|wrist)'
kp = 200
armature = 0.05
[[servo]]
match = '^(r|l)_gripper_l_finger_joint$'
name = '\1_gripper'
kp = 20
forcerange = 10
armature = 0.005

# Gazebo camera sensors to keep (sensor -> camera name; default: all, by sensor
# name), images scaled down to max_width.
[cameras]
max_width = 640
[cameras.names]
high_def_sensor = "high_def"
wide_stereo_l_stereo_camera_sensor = "wide_stereo"
narrow_stereo_l_stereo_camera_sensor = "narrow_stereo"
l_forearm_cam_sensor = "l_forearm_cam"
r_forearm_cam_sensor = "r_forearm_cam"

# TCP sites for the viewer's IK: link -> site, put on its parent at the link's origin.
[tcp]
r_gripper_tool_frame = "r_gripper_tcp"
l_gripper_tool_frame = "l_gripper_tcp"

# Colors for URDF materials that only name a texture (or to override one).
[colors]
RollLinks = "0.2 0.2 0.2 1"
Caster = "0.25 0.25 0.25 1"
Wheel_l = "0.2 0.2 0.2 1"
Wheel_r = "0.2 0.2 0.2 1"

# The home keyframe (clamped to the ranges; the rest 0): elbows bent (a
# straight arm is singular for IK), grippers half open.
[home]
torso_lift_joint = 0.1
r_shoulder_pan_joint = -0.3
l_shoulder_pan_joint = 0.3
r_shoulder_lift_joint = 0.3
l_shoulder_lift_joint = 0.3
r_elbow_flex_joint = -1.8
l_elbow_flex_joint = -1.8
r_wrist_flex_joint = -0.6
l_wrist_flex_joint = -0.6
r_gripper_l_finger_joint = 0.25
l_gripper_l_finger_joint = 0.25
