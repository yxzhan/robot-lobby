# Toyota's HSR (HSR-B, hsrb4s) for scripts/urdf2mjcf.py (keys: see pr2.toml):
#
#   git clone -b ros2-jazzy https://github.com/code-iai/hsr_description
#   python3 scripts/urdf2mjcf.py scripts/urdf2mjcf/hsrb.toml hsr_description

name = "hsrb"
out = "robots/aicor/hsrb"
source = "https://github.com/code-iai/hsr_description/tree/ros2-jazzy"
package = "hsr_description"
xacro = "robots/hsrb4s.urdf.xacro"

title = "HSR"
readme = """
Toyota's Human Support Robot (HSR-B, hsrb4s): an omnidirectional base, an
arm on a lift with the torso rising at half its speed (the URDF's mimic), a
pan-tilt head with stereo, wide and RGB-D cameras, a two-finger hand with a
camera in the palm. The base drives as a planar base (x / y / yaw servos;
its drive and caster wheels are welded); every other joint has a position
servo, the arm and head are gravity compensated. The hand is its
hand_l_proximal joint (actuator `hand_gripper`); the other finger and both
distal joints follow it (the hand_motor joint they mimic in the URDF is left
out, and the spring joints are welded).
"""
license = """
From [hsr_description](https://github.com/code-iai/hsr_description) (ros2-jazzy) by Toyota Motor
Corporation, BSD 3-Clause Clear (see its LICENSE.txt and NOTICE).
"""

gravcomp = ["arm_lift_link", "torso_lift_link"]

[links]
drop = ['^hand_motor_dummy_link$']
no_collision = ['_wheel_']

[joints]
weld = ['^base_roll_joint$', '_wheel_', '^hand_[lr]_(spring_proximal|mimic_distal)_joint$']

[base]
kind = "planar"
kp_xy = 50000
kp_yaw = 5000
damping = [100, 20]


[[servo]]
match = '^arm_lift_joint$'
kp = 5000
[[servo]]
match = '^arm_(flex|roll)_joint$'
kp = 300
armature = 0.05
[[servo]]
match = '^wrist_(flex|roll)_joint$'
kp = 50
armature = 0.01
[[servo]]
match = '^head_(pan|tilt)_joint$'
kp = 50
armature = 0.01
[[servo]]
match = '^hand_l_proximal_joint$'
name = 'hand_gripper'
kp = 5
forcerange = 3
armature = 0.002

[cameras]
max_width = 640
[cameras.names]
head_l_stereo_camera = "head_l_stereo_camera"
head_r_stereo_camera = "head_r_stereo_camera"
head_center_camera = "head_center_camera"
openni_camera_camera = "head_rgbd_sensor"
hand_camera = "hand_camera"

[tcp]
hand_gripper_tool_frame = "hand_tcp"

[home]
arm_lift_joint = 0.05
arm_flex_joint = -0.5
wrist_flex_joint = -1.0
hand_l_proximal_joint = 0.6
