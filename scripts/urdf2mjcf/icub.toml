# iCub 3 (IIT) from IAI's iai_robots for scripts/urdf2mjcf.py (keys: see pr2.toml):
#
#   git clone -b ros-jazzy https://github.com/code-iai/iai_robots
#   python3 scripts/urdf2mjcf.py scripts/urdf2mjcf/icub.toml iai_robots

name = "icub"
out = "robots/aicor/icub"
source = "https://github.com/code-iai/iai_robots/tree/ros-jazzy"
package = "iai_icub_description"
xacro = "robots/iCubGazeboV3_visuomanip/iCub3.urdf"

title = "iCub"
readme = """
IIT's iCub 3 humanoid (from IAI's iai_icub_description). There is no walking
controller for it, so its base is fixed: base_footprint stays where it is
spawned and the robot stands on its legs' servos. Every joint has a position
servo (fingers too) and the whole robot is gravity compensated.
"""
license = """
From [iai_robots](https://github.com/code-iai/iai_robots) (`iai_icub_description`), CC BY-SA 4.0.
"""

gravcomp = ["base_footprint"]

[base]
kind = "fixed"

[[servo]]
match = '_(hip|knee|ankle)_'
kp = 500
armature = 0.05
[[servo]]
match = '^torso_'
kp = 500
armature = 0.05
[[servo]]
match = '^(neck_|eyes_|[lr]_eye_)'
kp = 20
armature = 0.005
[[servo]]
match = '_(shoulder|elbow)_?'
kp = 100
armature = 0.02
[[servo]]
match = '_wrist_'
kp = 20
armature = 0.005
[[servo]]
match = '_hand_'
kp = 2
armature = 0.001

[tcp]
l_gripper_tool_frame = "l_tcp"
r_gripper_tool_frame = "r_tcp"

[home]
r_shoulder_roll = 0.4
l_shoulder_roll = 0.4
r_elbow = 0.8
l_elbow = 0.8
