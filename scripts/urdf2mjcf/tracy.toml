# IAI's Tracy (two UR10e arms with Robotiq 2F-85 grippers on a table) for
# scripts/urdf2mjcf.py (keys: see pr2.toml):
#
#   git clone -b ros2-jazzy https://github.com/code-iai/iai_tracy
#   python3 scripts/urdf2mjcf.py scripts/urdf2mjcf/tracy.toml iai_tracy [dir with robotiq_description]
#
# ur_description is the installed one (ros-jazzy-ur-description).

name = "tracy"
out = "robots/digital_twin/tracy"
source = "https://github.com/code-iai/iai_tracy/tree/ros2-jazzy"
package = "iai_tracy_description"
xacro = "urdf/tracy.urdf.xacro"
max_faces = 150000   # the table setup mesh (124k triangles) shows holes when simplified

title = "Tracy"
readme = """
IAI's Tracy: two UR arms with Robotiq 2F-85 grippers on a table, and a
camera over it. The table is fixed (no base joint); every arm joint has a
position servo and the arms are gravity compensated. Each gripper is its
left knuckle joint (actuator `*_gripper`), the rest of its linkage follows it
(the URDF's mimic joints).
"""
license = """
From [iai_tracy](https://github.com/code-iai/iai_tracy) (license not stated in its package.xml), with
meshes from ur_description (Universal Robots) and robotiq_description.
"""

gravcomp = ["map"]

[base]
kind = "fixed"

[[servo]]
match = '_(shoulder_pan|shoulder_lift|elbow)_joint$'
kp = 2000
armature = 0.5
[[servo]]
match = '_wrist_[123]_joint$'
kp = 300
armature = 0.1
[[servo]]
match = '^(left|right)_robotiq_85_left_knuckle_joint$'
name = '\1_gripper'
kp = 10
forcerange = 5
armature = 0.005

[[camera]]
name = "table_camera"
link = "camera_link"
fovy = 58

[tcp]
l_gripper_tool_frame = "left_tcp"
r_gripper_tool_frame = "right_tcp"

# Tracy's default pose (from IAI).
[home]
left_shoulder_pan_joint = 2.539670467376709
left_shoulder_lift_joint = -1.46823854119096
left_elbow_joint = 2.1197431723224085
left_wrist_1_joint = -1.4825000625899811
left_wrist_2_joint = 5.467689037322998
left_wrist_3_joint = -0.9808381239520472
right_shoulder_pan_joint = 3.7588136196136475
right_shoulder_lift_joint = -1.7489210567870082
right_elbow_joint = -2.054229259490967
right_wrist_1_joint = -1.6140786610045375
right_wrist_2_joint = 0.7295855283737183
right_wrist_3_joint = 3.944669485092163
