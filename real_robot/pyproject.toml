# real_robot as a package of its own, installable without the rest of the lobby:
#
#   pip install "git+https://github.com/yxzhan/robot-lobby@real-robot-bridge#subdirectory=real_robot"
#   pip install ./real_robot          # from a checkout
#
# This directory is the package itself (package-dir below), so `python -m
# real_robot` from the repository's root keeps working without installing.
# Not listed: rclpy and the ROS messages (real_robot.ros2: the ROS python,
# /usr/bin/python3 with ROS 2 sourced), franky (the Panda: a libfranka 0.9.2
# wheel from its GitHub releases, see README.md).

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lobby-real-robot"
version = "0.1.0"
description = "Real robots (Franka Panda, SO-101) behind robot-lobby's WebSocket and ros2_control, with a safety layer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["websockets>=13"]

[tool.setuptools]
package-dir = {"real_robot" = "."}
packages = ["real_robot", "real_robot.drivers"]
